name: openless

services:
  sync-server:
    image: openless-sync-server:latest
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: openless-sync-server
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/sync.db
      STORAGE_PATH: /app/data
    restart: unless-stopped
